name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  push: {branches: ["master", "main"]}
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          user: mauri101-Ar
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          
          # Mira tus repos y colaboraciones
          repositories_affiliations: owner, collaborator
          
          plugin_languages: yes
          
          # === LA MAGIA: MODO INDEPTH ===
          # Activa el análisis de commits reales
          plugin_languages_indepth: yes
          
          # Aumentamos el tiempo de espera porque leer la historia tarda más
          plugin_languages_analysis_timeout: 60
          
          # FILTRO DE AUTOR: Solo cuenta líneas donde el autor coincida con esto.
          # Agrega aquí todos los emails que hayas usado en tus commits.
          commits_authoring: mauri101-Ar, mauribrunner@gmail.com
          
          # Seguimos ignorando cosas que no son código real (Notebooks, HTML, etc)
          # NOTA: Ya no hace falta ignorar 'C', porque si no lo escribiste tú, no saldrá.
          plugin_languages_ignored: >-
            html, css, tex, kvlang, makefile, jupyter notebook
            
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          
          filename: github-metrics.svg
